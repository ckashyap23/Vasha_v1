<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BN → EN Translation & Scoring</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; margin-top: 40px; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 20px; margin-top: 12px; }
  label { display: block; margin: 10px 0 4px; font-size: 14px; font-weight: 600; }
  select, input[type=file], input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 14px; padding: 10px 18px; border: none; border-radius: 6px; background: #111; color: #fff; cursor: pointer; font-size: 14px; }
  button:disabled { background: #999; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 14px; }
  .status.running { color: #b8860b; }
  .status.done { color: #0a7a2f; }
  .status.failed { color: #c0392b; }
  a.download { display: inline-block; margin-top: 8px; }
  small { color: #666; }
</style>
</head>
<body>

<h1>BN ↔ EN Translation &amp; Scoring</h1>
<p><small>Each run triggers your actual Kaggle notebook — expect several minutes (GPU load + inference).</small></p>

<h2>1. Translate</h2>
<div class="card">
  <label for="translate-file">Excel file (columns: ben, ref_en [optional], source [optional])</label>
  <input type="file" id="translate-file" accept=".xlsx,.xls" />

  <label for="translate-model">Model</label>
  <select id="translate-model"></select>

  <label for="translate-label">Run label (optional — e.g. "finetuned_v1")</label>
  <input type="text" id="translate-label" placeholder="defaults to model name" />

  <button id="translate-submit">Translate</button>
  <div id="translate-status" class="status"></div>
</div>

<h2>2. Score</h2>
<div class="card">
  <label for="score-file">Excel file (columns: ben, ref_en [optional], source [optional], translated_en)</label>
  <input type="file" id="score-file" accept=".xlsx,.xls" />

  <label for="score-label">Run label (optional)</label>
  <input type="text" id="score-label" placeholder="e.g. base_qwen3b" />

  <button id="score-submit">Score</button>
  <div id="score-status" class="status"></div>
</div>

<script>
const API_BASE = ""; // same-origin; set to your backend URL if hosted separately

async function loadModels() {
  const res = await fetch(`${API_BASE}/api/models`);
  const data = await res.json();
  const select = document.getElementById("translate-model");
  select.innerHTML = "";
  data.models.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });
}
loadModels();

function setStatus(el, text, cls) {
  el.textContent = text;
  el.className = "status" + (cls ? " " + cls : "");
}

async function pollJob(jobId, statusEl, onDone) {
  const res = await fetch(`${API_BASE}/api/jobs/${jobId}`);
  const job = await res.json();

  if (job.status === "queued" || job.status === "running") {
    setStatus(statusEl, `Status: ${job.status}... (this can take several minutes)`, "running");
    setTimeout(() => pollJob(jobId, statusEl, onDone), 8000);
  } else if (job.status === "done") {
    setStatus(statusEl, "Done.", "done");
    onDone(jobId, job.result_filename);
  } else if (job.status === "failed") {
    setStatus(statusEl, `Failed: ${job.error || "unknown error"}`, "failed");
  }
}

function addDownloadLink(container, jobId, filename) {
  const a = document.createElement("a");
  a.href = `${API_BASE}/api/jobs/${jobId}/download`;
  a.textContent = `Download ${filename}`;
  a.className = "download";
  container.appendChild(document.createElement("br"));
  container.appendChild(a);
}

document.getElementById("translate-submit").addEventListener("click", async () => {
  const fileInput = document.getElementById("translate-file");
  const model = document.getElementById("translate-model").value;
  const runLabel = document.getElementById("translate-label").value;
  const statusEl = document.getElementById("translate-status");

  if (!fileInput.files.length) { setStatus(statusEl, "Please choose a file.", "failed"); return; }

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  formData.append("model", model);
  formData.append("run_label", runLabel);

  setStatus(statusEl, "Uploading and starting job...", "running");
  const res = await fetch(`${API_BASE}/api/translate`, { method: "POST", body: formData });
  if (!res.ok) { setStatus(statusEl, "Failed to start job: " + (await res.text()), "failed"); return; }
  const { job_id } = await res.json();
  pollJob(job_id, statusEl, (jobId, filename) => addDownloadLink(statusEl, jobId, filename));
});

document.getElementById("score-submit").addEventListener("click", async () => {
  const fileInput = document.getElementById("score-file");
  const runLabel = document.getElementById("score-label").value;
  const statusEl = document.getElementById("score-status");

  if (!fileInput.files.length) { setStatus(statusEl, "Please choose a file.", "failed"); return; }

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  formData.append("run_label", runLabel);

  setStatus(statusEl, "Uploading and starting job...", "running");
  const res = await fetch(`${API_BASE}/api/score`, { method: "POST", body: formData });
  if (!res.ok) { setStatus(statusEl, "Failed to start job: " + (await res.text()), "failed"); return; }
  const { job_id } = await res.json();
  pollJob(job_id, statusEl, (jobId, filename) => addDownloadLink(statusEl, jobId, filename));
});
</script>

</body>
</html>
